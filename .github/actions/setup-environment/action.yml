name: "Setup uv (centralized version) + checkout + Python"
description: "Checkout repo, set up Python, and install uv using the version pinned in .github/uv-version.txt"
inputs:
  python-version:
    description: "Python version to set up (e.g., 3.12)"
    required: false
    default: ""
  python-version-file:
    description: "Path to a .python-version file"
    required: false
    default: ""
  dev:
    description: "Whether to install dev dependencies"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install protoc
      shell: bash
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
        elif [[ "$OSTYPE" == "darwin"* ]]; then
          brew install protobuf
        fi

    - name: Set up Python from file
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ inputs.python-version-file }}
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.8
        enable-cache: true

    - name: Install the project
      shell: bash
      run: |
        echo "Installing syncing uv..."
        if [[ "${{ inputs.dev }}" == "true" ]]; then
          uv sync --locked --dev
        else
          uv sync --locked --no-dev
        fi
