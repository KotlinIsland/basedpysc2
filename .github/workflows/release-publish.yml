name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          python-version-file: ".python-version"

      - name: Install cibuildwheel
        run: uv sync --group wheelhouse

      - name: Set up QEMU for ARM emulation (Linux only)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        run: uv run cibuildwheel --output-dir wheelhouse
        env:
          BAZELISK_VERSION: v1.27.0
          CIBW_BUILD: cp313-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          # Install bazelisk before building
          CIBW_BEFORE_ALL_LINUX: >
            if [ "$(uname -m)" = "x86_64" ]; then
              ARCH="amd64";
            elif [ "$(uname -m)" = "aarch64" ]; then
              ARCH="arm64";
            fi &&
            curl -Lo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/${{ env.BAZELISK_VERSION }}/bazelisk-linux-${ARCH} &&
            chmod +x /usr/local/bin/bazel
          CIBW_BEFORE_ALL_MACOS: >
            curl -Lo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/${{ env.BAZELISK_VERSION }}/bazelisk-darwin-$(uname -m) &&
            chmod +x /usr/local/bin/bazel
          # Build C++ extensions with Bazel before Python build
          CIBW_BEFORE_BUILD: >
            bazel build //src/pysc2/env/converter/cc/python:converter &&
            mkdir -p src/pysc2/env/converter/cc/python &&
            cp bazel-bin/src/pysc2/env/converter/cc/python/converter*.so src/pysc2/env/converter/cc/python/
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/pysc2
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: Attach artifacts to release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "**"
          path: dist
          merge-multiple: true

      - name: Attach built artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
