name: just testing
on:
  pull_request:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15] #, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          python-version-file: ".python-version"

      - name: Install cibuildwheel
        run: uv sync --group wheelhouse

      - name: Set up QEMU for ARM emulation (Linux only)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: |
          if [[ "${{ matrix.os }}" == *"26"* ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=26.0" >> $GITHUB_ENV
          else
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> $GITHUB_ENV
          fi

      - name: Build wheels
        run: uv run cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
